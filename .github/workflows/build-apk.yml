name: Build APK (Godot 4.6.3)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GODOT_VERSION: "4.6.3"
  GODOT_RELEASE: "4.6.3-stable"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Pasang JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Pastikan Android SDK bawaan runner ada
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          ls "$SDK" && ls "$SDK/build-tools" || true

      - name: Cache Godot dan export templates
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_RELEASE }}-linux-v1

      - name: Unduh Godot headless dan export templates (jika belum ada di cache)
        run: |
          set -e
          B="https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}"
          if [ ! -x "$HOME/godot/godot-bin" ]; then
            mkdir -p "$HOME/godot"
            cd "$HOME/godot"
            curl -fL -o godot.zip "$B/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
            unzip -q godot.zip && mv Godot_v${GODOT_RELEASE}_linux.x86_64 godot-bin
            rm -f godot.zip
            chmod +x godot-bin
          fi
          TPL="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          if [ ! -d "$TPL" ]; then
            mkdir -p "$TPL"
            cd "$RUNNER_TEMP"
            curl -fL -o templates.tpz "$B/Godot_v${GODOT_RELEASE}_export_templates.tpz"
            unzip -q templates.tpz -d tpl
            mv tpl/templates/* "$TPL/"
          fi
          echo "GODOT_BIN=$HOME/godot/godot-bin" >> "$GITHUB_ENV"

      - name: Atur path SDK dan JDK untuk Godot
        run: |
          SDK="$ANDROID_HOME"
          JDK="$JAVA_HOME"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JDK"
          export/android/debug_keystore = ""
          EOF

      - name: Kunci debug untuk APK uji (tetap, disimpan di repositori)
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Atur nomor versi dari nomor run
        run: |
          sed -i "s/^version\/code=.*/version\/code=${GITHUB_RUN_NUMBER}/" export_presets.cfg

      - name: Import proyek dan export APK
        run: |
          mkdir -p build
          "$GODOT_BIN" --headless --import || true
          "$GODOT_BIN" --headless --export-debug "Android" build/game-baru-debug.apk

      - name: Cek APK dibuat
        run: |
          test -s build/game-baru-debug.apk
          ls -lh build/game-baru-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: game-baru-debug-apk
          path: build/game-baru-debug.apk
          retention-days: 14
