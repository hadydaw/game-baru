name: Tes Otomatis (GUT dan smoke test)

# Workflow terpisah dari build APK. Menjalankan unit test GUT dan smoke test layar terminal
# di Godot headless. Hasil lulus atau gagal terlihat di tab Actions.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GODOT_RELEASE: "4.6.3-stable"

jobs:
  tes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Unduh Godot headless
        run: |
          set -e
          mkdir -p "$HOME/godot" && cd "$HOME/godot"
          B="https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}"
          curl -fL -o godot.zip "$B/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q godot.zip && mv Godot_v${GODOT_RELEASE}_linux.x86_64 godot-bin
          chmod +x godot-bin
          echo "GODOT_BIN=$HOME/godot/godot-bin" >> "$GITHUB_ENV"

      - name: Pasang addon GUT
        run: |
          set -e
          git clone --depth 1 https://github.com/bitwes/Gut.git "$RUNNER_TEMP/gut"
          mkdir -p addons
          cp -r "$RUNNER_TEMP/gut/addons/gut" addons/

      - name: Import proyek
        run: |
          "$GODOT_BIN" --headless --import || true

      - name: Jalankan unit test GUT
        run: |
          "$GODOT_BIN" --headless -s addons/gut/gut_cmdln.gd -gdir=res://tests -gprefix=test_ -gexit > gut.log 2>&1
          code=$?
          cat gut.log
          if grep -q "SCRIPT ERROR\|Parse Error" gut.log; then
            echo "Ada error skrip di GUT"
            exit 1
          fi
          exit $code

      - name: Jalankan smoke test terminal
        run: |
          "$GODOT_BIN" --headless -s tests/smoke_terminal.gd > smoke.log 2>&1
          code=$?
          cat smoke.log
          if grep -q "SCRIPT ERROR\|Parse Error" smoke.log; then
            echo "Ada error skrip di smoke test"
            exit 1
          fi
          exit $code

      - name: Jalankan smoke test peta jaringan
        run: |
          "$GODOT_BIN" --headless -s tests/smoke_peta.gd > peta.log 2>&1
          code=$?
          cat peta.log
          if grep -q "SCRIPT ERROR\|Parse Error" peta.log; then
            echo "Ada error skrip di smoke test peta"
            exit 1
          fi
          exit $code

      - name: Jalankan smoke test layar Pasar
        run: |
          "$GODOT_BIN" --headless -s tests/smoke_pasar.gd > pasar.log 2>&1
          code=$?
          cat pasar.log
          if grep -q "SCRIPT ERROR\|Parse Error" pasar.log; then
            echo "Ada error skrip di smoke test pasar"
            exit 1
          fi
          exit $code

      - name: Jalankan smoke test menu utama
        run: |
          "$GODOT_BIN" --headless -s tests/smoke_menu.gd > menu.log 2>&1
          code=$?
          cat menu.log
          if grep -q "SCRIPT ERROR\|Parse Error" menu.log; then
            echo "Ada error skrip di smoke test menu"
            exit 1
          fi
          exit $code

      - name: Jalankan smoke test Desktop dan dialog kembali ke menu
        run: |
          "$GODOT_BIN" --headless -s tests/smoke_desktop.gd > desktop.log 2>&1
          code=$?
          cat desktop.log
          if grep -q "SCRIPT ERROR\|Parse Error" desktop.log; then
            echo "Ada error skrip di smoke test desktop"
            exit 1
          fi
          exit $code

      - name: Jalankan smoke test splash
        run: |
          "$GODOT_BIN" --headless -s tests/smoke_splash.gd > splash.log 2>&1
          code=$?
          cat splash.log
          if grep -q "SCRIPT ERROR\|Parse Error" splash.log; then
            echo "Ada error skrip di smoke test splash"
            exit 1
          fi
          exit $code
